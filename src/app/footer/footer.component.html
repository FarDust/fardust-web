<footer class="console-footer">
  <div class="console-footer__inner">
    <p class="console-footer__status" aria-label="Profile summary">
      <app-pretext-text
        [text]="'Focus: ML engineering'"
        [noWrap]="true"
      ></app-pretext-text>
      <span class="console-footer__divider" aria-hidden="true">|</span>
      <span class="hidden sm:inline">
        <app-pretext-text
          [text]="'Stack: Python / TS / GCP'"
          [noWrap]="true"
        ></app-pretext-text>
      </span>
      <span class="console-footer__divider hidden sm:inline" aria-hidden="true"
        >|</span
      >
      <span class="hidden lg:inline">
        <app-pretext-text
          [text]="'Lang: ES / EN'"
          [noWrap]="true"
        ></app-pretext-text>
      </span>
      <span class="console-footer__divider hidden lg:inline" aria-hidden="true"
        >|</span
      >
      <span class="hidden xl:inline">
        <app-pretext-text
          [text]="'CV: 2026-01-30'"
          [noWrap]="true"
        ></app-pretext-text>
      </span>
    </p>

    <nav class="console-footer__links" aria-label="Footer links">
      <a
        [href]="
          ((githubService$ | async)?.html_url || 'https://github.com/FarDust') +
          '/fardust-web'
        "
        target="_blank"
        rel="noopener noreferrer"
      >
        <app-pretext-text [text]="'Source'" [noWrap]="true"></app-pretext-text>
      </a>
      <a routerLink="/experience">
        <app-pretext-text
          [text]="'Curriculum'"
          [noWrap]="true"
        ></app-pretext-text>
      </a>
      <a routerLink="/pretext">
        <app-pretext-text
          [text]="'Pretext lab'"
          [noWrap]="true"
        ></app-pretext-text>
      </a>
      <a href="mailto:gnfaundez@uc.cl">
        <app-pretext-text [text]="'Contact'" [noWrap]="true"></app-pretext-text>
      </a>
    </nav>
  </div>
</footer>
