<div class="personal-info my-4">
  <p class="personal-info__public">
    <app-pretext-text
      [text]="'personal_info_public_bio' | translate"
    ></app-pretext-text>
  </p>
  @if (personalInfoEnabled) {
    <details class="personal-info__details">
      <summary class="personal-info__summary">
        <app-pretext-text
          [text]="'personal_info_toggle' | translate"
        ></app-pretext-text>
      </summary>
      <div class="personal-info__controls">
        <label class="personal-info__label" for="personal-token">
          <app-pretext-text
            [text]="'personal_info_token_label' | translate"
          ></app-pretext-text>
        </label>
        <input
          id="personal-token"
          type="password"
          [(ngModel)]="token"
          class="personal-info__input"
          [placeholder]="'personal_info_token_placeholder' | translate"
          autocomplete="off"
          spellcheck="false"
          autocapitalize="none"
        />
        <div class="personal-info__actions">
          <button
            type="button"
            class="personal-info__button personal-info__button--primary"
            (click)="submitToken()"
          >
            <app-pretext-text
              [text]="'personal_info_load' | translate"
            ></app-pretext-text>
          </button>
          @if (token) {
            <button
              type="button"
              class="personal-info__button"
              (click)="clearToken()"
            >
              <app-pretext-text
                [text]="'personal_info_clear' | translate"
              ></app-pretext-text>
            </button>
          }
        </div>
      </div>
    </details>
  }
  @if (errorKey) {
    <p class="personal-info__error">
      <app-pretext-text [text]="errorKey | translate"></app-pretext-text>
    </p>
  }
  @if (personal$ | async; as personal) {
    <div class="personal-info__private">
      <app-pretext-text
        [text]="personal.privateBio"
        [whiteSpace]="'pre-wrap'"
      ></app-pretext-text>
    </div>
  }
</div>
