<div class="personal-info my-4">
  <p class="mb-4 whitespace-pre-line text-sm leading-7 text-slate-300">
    {{ 'personal_info_public_bio' | translate }}
  </p>
  @if (personalInfoEnabled) {
    <details
      class="rounded-[22px] border border-white/10 bg-[#060e20]/90 p-4 text-left"
    >
      <summary
        class="cursor-pointer font-display text-lg font-semibold text-white"
      >
        {{ 'personal_info_toggle' | translate }}
      </summary>
      <div class="mt-3 space-y-3">
        <label
          class="block text-sm font-medium text-slate-300"
          for="personal-token"
        >
          {{ 'personal_info_token_label' | translate }}
        </label>
        <input
          id="personal-token"
          type="password"
          [(ngModel)]="token"
          class="w-full rounded-xl border border-white/20 bg-[#131b2e] px-3 py-2 text-white placeholder:text-white/40"
          [placeholder]="'personal_info_token_placeholder' | translate"
          autocomplete="off"
          spellcheck="false"
          autocapitalize="none"
        />
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            class="rounded-full bg-gradient-to-r from-[#81ecff] to-[#4b8eff] px-4 py-2 text-sm font-semibold text-[#001a41] shadow-lg shadow-cyan-500/20 transition hover:-translate-y-0.5"
            (click)="submitToken()"
          >
            {{ 'personal_info_load' | translate }}
          </button>
          @if (token) {
            <button
              type="button"
              class="rounded-full border border-white/20 px-4 py-2 text-sm text-white transition hover:bg-white/10"
              (click)="clearToken()"
            >
              {{ 'personal_info_clear' | translate }}
            </button>
          }
        </div>
      </div>
    </details>
  }
  @if (errorKey) {
    <p class="mt-3 text-sm text-red-300">{{ errorKey | translate }}</p>
  }
  @if (personal$ | async; as personal) {
    <div
      class="mt-4 whitespace-pre-line rounded-[22px] border border-white/10 bg-[#060e20]/90 p-4 text-sm leading-7 text-slate-200"
    >
      {{ personal.privateBio }}
    </div>
  }
</div>
