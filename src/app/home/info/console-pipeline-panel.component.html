<section class="console-pipelines animate-panel-rise">
  <div class="console-pipelines__header">
    <h2 class="console-pipelines__title">
      <app-pretext-text [text]="'Core capabilities'"></app-pretext-text>
    </h2>
    <app-pretext-text
      class="console-pipelines__meta"
      [text]="'Source: CV 2026 + live site'"
      [noWrap]="true"
    ></app-pretext-text>
  </div>

  <div class="console-pipelines__grid">
    @for (stage of stages(); track stage.label; let last = $last) {
      <article class="console-pipelines__stage">
        <div class="console-pipelines__stage-header">
          <app-pretext-text
            class="console-pipelines__label"
            [text]="stage.label"
          ></app-pretext-text>
          <app-pretext-text
            class="console-pipelines__state"
            [ngClass]="stageToneClass(stage)"
            [text]="stage.emphasis"
            [noWrap]="true"
          >
          </app-pretext-text>
        </div>
        <div class="console-pipelines__track">
          <div
            class="console-pipelines__fill"
            [style.width.%]="stage.progress"
          ></div>
        </div>
        <p class="console-pipelines__detail">
          <app-pretext-text [text]="stage.detail"></app-pretext-text>
        </p>
      </article>

      @if (!last) {
        <div class="console-pipelines__arrow" aria-hidden="true">
          <span class="material-symbols-outlined">chevron_right</span>
        </div>
      }
    }
  </div>
</section>
