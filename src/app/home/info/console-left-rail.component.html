<nav class="console-rail animate-panel-rise" aria-label="Landing navigation">
  <div class="console-rail__identity">
    <p class="console-rail__eyebrow">
      <app-pretext-text
        [text]="'Profile console'"
        [noWrap]="true"
      ></app-pretext-text>
    </p>
    <h2 class="console-rail__title">
      <app-pretext-text [text]="'G_FAUNDEZ'" [noWrap]="true"></app-pretext-text>
    </h2>
    <p class="console-rail__path">
      <app-pretext-text [text]="path()" [noWrap]="true"></app-pretext-text>
    </p>
  </div>

  <div class="console-rail__group">
    @for (item of primaryItems(); track item.label) {
      @if (item.href) {
        <a
          [href]="item.href"
          target="_blank"
          rel="noopener noreferrer"
          class="console-rail__link"
          [class.console-rail__link--active]="item.active"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{
            item.icon
          }}</span>
          <app-pretext-text
            [text]="item.label"
            [noWrap]="true"
          ></app-pretext-text>
        </a>
      } @else {
        <a
          [routerLink]="item.routerLink"
          [fragment]="item.fragment"
          class="console-rail__link"
          [class.console-rail__link--active]="item.active"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{
            item.icon
          }}</span>
          <app-pretext-text
            [text]="item.label"
            [noWrap]="true"
          ></app-pretext-text>
        </a>
      }
    }
  </div>

  <section class="console-rail__focus">
    <p class="console-rail__focus-label">
      <app-pretext-text
        [text]="'Current focus'"
        [noWrap]="true"
      ></app-pretext-text>
    </p>
    <p class="console-rail__focus-value">
      <app-pretext-text [text]="focus()"></app-pretext-text>
    </p>
  </section>

  <div class="console-rail__group console-rail__group--minor">
    @for (item of utilityItems(); track item.label) {
      @if (item.href) {
        <a
          [href]="item.href"
          target="_blank"
          rel="noopener noreferrer"
          class="console-rail__link console-rail__link--minor"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{
            item.icon
          }}</span>
          <app-pretext-text
            [text]="item.label"
            [noWrap]="true"
          ></app-pretext-text>
        </a>
      } @else {
        <a
          [routerLink]="item.routerLink"
          [fragment]="item.fragment"
          class="console-rail__link console-rail__link--minor"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{
            item.icon
          }}</span>
          <app-pretext-text
            [text]="item.label"
            [noWrap]="true"
          ></app-pretext-text>
        </a>
      }
    }
  </div>
</nav>
