<section class="console-registry animate-panel-rise">
  <div class="console-registry__header">
    <h2 class="console-registry__title">
      <app-pretext-text
        [text]="'Selected work'"
        [noWrap]="true"
      ></app-pretext-text>
    </h2>
    <app-pretext-text
      class="console-registry__meta"
      [text]="'Live site references'"
      [noWrap]="true"
    ></app-pretext-text>
  </div>

  <div class="console-registry__grid">
    @for (card of cards(); track card.title) {
      @if (card.href) {
        <a
          [href]="card.href"
          target="_blank"
          rel="noopener noreferrer"
          class="console-registry__card"
        >
          <div class="console-registry__card-header">
            <app-pretext-text
              class="console-registry__path"
              [text]="card.eyebrow"
              [noWrap]="true"
            ></app-pretext-text>
          </div>
          <h3 class="console-registry__card-title">
            <app-pretext-text [text]="card.title"></app-pretext-text>
          </h3>
          <p class="console-registry__card-copy">
            <app-pretext-text [text]="card.description"></app-pretext-text>
          </p>

          <div class="console-registry__stats">
            @for (stat of card.meta; track stat.label) {
              <div class="console-registry__stat-line">
                <app-pretext-text
                  class="console-registry__stat-key"
                  [text]="stat.label"
                  [noWrap]="true"
                ></app-pretext-text>
                <app-pretext-text
                  class="console-registry__stat-value"
                  [text]="stat.value"
                  [noWrap]="true"
                ></app-pretext-text>
              </div>
            }
          </div>
        </a>
      } @else {
        <a [routerLink]="card.routerLink" class="console-registry__card">
          <div class="console-registry__card-header">
            <app-pretext-text
              class="console-registry__path"
              [text]="card.eyebrow"
              [noWrap]="true"
            ></app-pretext-text>
          </div>
          <h3 class="console-registry__card-title">
            <app-pretext-text [text]="card.title"></app-pretext-text>
          </h3>
          <p class="console-registry__card-copy">
            <app-pretext-text [text]="card.description"></app-pretext-text>
          </p>

          <div class="console-registry__stats">
            @for (stat of card.meta; track stat.label) {
              <div class="console-registry__stat-line">
                <app-pretext-text
                  class="console-registry__stat-key"
                  [text]="stat.label"
                  [noWrap]="true"
                ></app-pretext-text>
                <app-pretext-text
                  class="console-registry__stat-value"
                  [text]="stat.value"
                  [noWrap]="true"
                ></app-pretext-text>
              </div>
            }
          </div>
        </a>
      }
    }

    <div class="console-registry__placeholder">
      <span class="material-symbols-outlined">add_circle</span>
      <app-pretext-text
        [text]="'More references on GitHub'"
        [noWrap]="true"
      ></app-pretext-text>
    </div>
  </div>

  <div class="console-registry__modules">
    @for (item of modules(); track item.title) {
      @if (item.href) {
        <a
          [href]="item.href"
          target="_blank"
          rel="noopener noreferrer"
          class="console-registry__module"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span>
            <app-pretext-text
              class="console-registry__module-title"
              [text]="item.title"
            ></app-pretext-text>
            <app-pretext-text
              class="console-registry__module-copy"
              [text]="item.description"
              [noWrap]="true"
            ></app-pretext-text>
          </span>
        </a>
      } @else {
        <a [routerLink]="item.routerLink" class="console-registry__module">
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span>
            <app-pretext-text
              class="console-registry__module-title"
              [text]="item.title"
            ></app-pretext-text>
            <app-pretext-text
              class="console-registry__module-copy"
              [text]="item.description"
              [noWrap]="true"
            ></app-pretext-text>
          </span>
        </a>
      }
    }
  </div>
</section>
