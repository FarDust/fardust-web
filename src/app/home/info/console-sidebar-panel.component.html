<aside class="console-sidebar animate-panel-rise">
  <section class="console-sidebar__card">
    <header class="console-sidebar__card-header">
      <app-pretext-text
        [text]="'Profile details'"
        [noWrap]="true"
      ></app-pretext-text>
    </header>
    <div class="console-sidebar__card-body console-sidebar__specs">
      @for (field of specifications(); track field.label) {
        <div class="console-sidebar__spec-line">
          <app-pretext-text
            class="console-sidebar__spec-key"
            [text]="field.label"
            [noWrap]="true"
          ></app-pretext-text>
          <app-pretext-text
            class="console-sidebar__spec-value"
            [text]="field.value"
            [noWrap]="true"
          ></app-pretext-text>
        </div>
      }
    </div>
  </section>

  <section class="console-sidebar__card">
    <header
      class="console-sidebar__card-header console-sidebar__card-header--split"
    >
      <app-pretext-text
        [text]="'Experience log'"
        [noWrap]="true"
      ></app-pretext-text>
      <span class="console-sidebar__window-controls" aria-hidden="true">
        <span></span>
        <span></span>
      </span>
    </header>
    <div class="console-sidebar__card-body console-sidebar__logs">
      @for (entry of logs(); track entry.time + entry.message) {
        <p class="console-sidebar__log-line">
          <app-pretext-text
            class="console-sidebar__log-time"
            [ngClass]="logToneClass(entry.tone)"
            [text]="entry.time"
            [noWrap]="true"
          >
          </app-pretext-text>
          <app-pretext-text
            class="console-sidebar__log-message"
            [text]="entry.message"
          ></app-pretext-text>
        </p>
      }
      <p class="console-sidebar__cursor">_</p>
    </div>
  </section>

  <section class="console-sidebar__action">
    <p class="console-sidebar__action-label">
      <app-pretext-text
        [text]="'Primary action'"
        [noWrap]="true"
      ></app-pretext-text>
    </p>
    @if (action().href) {
      <a
        [href]="action().href"
        target="_blank"
        rel="noopener noreferrer"
        class="console-sidebar__action-button"
      >
        <app-pretext-text
          [text]="action().label"
          [noWrap]="true"
        ></app-pretext-text>
      </a>
    } @else {
      <a
        [routerLink]="action().routerLink"
        class="console-sidebar__action-button"
      >
        <app-pretext-text
          [text]="action().label"
          [noWrap]="true"
        ></app-pretext-text>
      </a>
    }
  </section>

  <section class="console-sidebar__card">
    <header class="console-sidebar__card-header">
      <app-pretext-text
        [text]="'Personal note'"
        [noWrap]="true"
      ></app-pretext-text>
    </header>
    <div class="console-sidebar__card-body">
      <app-personal-info></app-personal-info>
    </div>
  </section>
</aside>
