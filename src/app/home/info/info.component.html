<div class="background console-route relative">
  <div class="relative z-10 animate-fade-in">
    <div class="console-route__inner text-white">
      <section class="console-layout" id="console-core">
        <app-console-left-rail
          class="console-layout__rail"
          [primaryItems]="railPrimaryItems"
          [utilityItems]="railUtilityItems"
          [focus]="currentFocus"
          [path]="'~/fardust-web/home'"
        ></app-console-left-rail>

        <div class="console-layout__body">
          <div class="console-layout__main">
            <app-console-hero-panel
              [github]="(githubService$ | async) ?? null"
              [metrics]="heroMetrics"
              [primaryAction]="primaryAction"
              [specifications]="modelSpecifications"
            ></app-console-hero-panel>

            <app-console-pipeline-panel
              [stages]="pipelineStages"
            ></app-console-pipeline-panel>

            <app-console-project-registry
              id="console-projects"
              [cards]="registryCards"
              [modules]="supportModules"
            ></app-console-project-registry>
          </div>

          <app-console-sidebar-panel
            class="console-layout__sidebar"
            [specifications]="modelSpecifications"
            [logs]="systemLogs"
            [action]="primaryAction"
          ></app-console-sidebar-panel>
        </div>
      </section>
    </div>

    @if (easterEgg) {
      <div
        class="easter-egg fixed bottom-4 right-4 rounded-full border border-white/10 bg-[#0b1326]/95 px-4 py-2 text-white"
      >
        <app-pretext-text
          [text]="'🎉 ¡Easter egg desbloqueado!'"
        ></app-pretext-text>
      </div>
    }

    @if (starTrekEgg) {
      <div
        class="easter-egg fixed bottom-20 right-4 rounded-full border border-white/10 bg-[#0b1326]/95 px-4 py-2 text-white"
      >
        <app-pretext-text [text]="'🛸 Make it so!'"></app-pretext-text>
        <a href="https://www.startrek.com" class="underline">
          <app-pretext-text [text]="'Captain Picard'"></app-pretext-text>
        </a>
      </div>
    }
  </div>
</div>
