<nav class="console-navbar">
  <div class="console-navbar__inner">
    <div class="console-navbar__cluster">
      <a
        class="console-navbar__brand"
        [routerLink]="['/']"
        fragment="console-core"
      >
        <app-pretext-text
          class="console-navbar__brand-mark"
          [text]="'G.FAUNDEZ'"
          [noWrap]="true"
        ></app-pretext-text>
        <app-pretext-text
          class="console-navbar__brand-context"
          [text]="'Profile console'"
          [noWrap]="true"
        ></app-pretext-text>
      </a>

      <div class="console-navbar__links" aria-label="Primary navigation">
        @for (item of navItems; track item.id) {
          <a
            class="nav-link"
            [class.nav-link--active]="isNavItemActive(item.id)"
            [routerLink]="[item.route]"
            [fragment]="item.fragment ?? null"
          >
            <app-pretext-text
              [text]="item.label"
              [noWrap]="true"
            ></app-pretext-text>
          </a>
        }
      </div>
    </div>

    <div class="console-navbar__actions">
      <p class="console-navbar__status" aria-live="polite">
        <app-pretext-text
          class="console-navbar__status-label"
          [text]="'Context'"
          [noWrap]="true"
        ></app-pretext-text>
        <app-pretext-text
          class="console-navbar__status-value"
          [text]="currentContextLabel()"
          [noWrap]="true"
        ></app-pretext-text>
      </p>

      <a
        class="console-navbar__github"
        [href]="(githubService$ | async)?.html_url"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="GitHub profile (opens in new tab)"
      >
        <i class="fab fa-github" aria-hidden="true"></i>
        <app-pretext-text
          [text]="(githubService$ | async)?.login || 'FarDust'"
          [noWrap]="true"
        ></app-pretext-text>
      </a>

      <button
        class="console-navbar__toggle"
        type="button"
        aria-controls="mainNavbar"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <div
      id="mainNavbar"
      class="console-navbar__mobile"
      [class.hidden]="!menuOpen"
      [class.block]="menuOpen"
    >
      <div class="console-navbar__mobile-links">
        <p class="console-navbar__mobile-status">
          <app-pretext-text
            [text]="currentContextLabel()"
            [noWrap]="true"
          ></app-pretext-text>
        </p>
        <div class="console-navbar__mobile-list md:hidden">
          @for (item of navItems; track item.id) {
            <a
              class="mobile-nav-link"
              [class.mobile-nav-link--active]="isNavItemActive(item.id)"
              [routerLink]="[item.route]"
              [fragment]="item.fragment ?? null"
              (click)="closeMenu()"
            >
              <app-pretext-text
                [text]="item.label"
                [noWrap]="true"
              ></app-pretext-text>
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</nav>
