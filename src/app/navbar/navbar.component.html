<nav class="console-navbar">
  <div class="console-navbar__inner">
    <div class="console-navbar__cluster">
      <a
        class="console-navbar__brand"
        [routerLink]="['/']"
        fragment="console-core"
      >
        <span class="console-navbar__brand-mark">G.FAUNDEZ</span>
        <span class="console-navbar__brand-context">PROFILE_CONSOLE</span>
      </a>

      <div class="console-navbar__links" aria-label="Primary navigation">
        <a
          class="nav-link"
          [class.nav-link--active]="isHomeRoute()"
          [routerLink]="['/']"
          fragment="console-core"
        >
          Overview
        </a>
        <a
          class="nav-link"
          [class.nav-link--active]="isExperienceRoute()"
          [routerLink]="['/experience']"
        >
          Experience
        </a>
      </div>
    </div>

    <div class="console-navbar__actions">
      <p class="console-navbar__status" aria-live="polite">
        <span class="console-navbar__status-label">Context</span>
        <span class="console-navbar__status-value">{{
          currentContextLabel()
        }}</span>
      </p>

      <a
        class="console-navbar__github"
        [href]="(githubService$ | async)?.html_url"
        rel="noopener noreferrer"
        target="_blank"
      >
        <i class="fab fa-github" aria-hidden="true"></i>
        <span>{{ (githubService$ | async)?.login }}</span>
      </a>

      <button
        class="console-navbar__toggle"
        type="button"
        aria-controls="mainNavbar"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <div
      id="mainNavbar"
      class="console-navbar__mobile"
      [class.hidden]="!menuOpen"
      [class.block]="menuOpen"
    >
      <div class="console-navbar__mobile-links">
        <p class="console-navbar__mobile-status">{{ currentContextLabel() }}</p>
        <div class="grid gap-2 md:hidden">
          <a
            class="mobile-nav-link"
            [class.mobile-nav-link--active]="isHomeRoute()"
            [routerLink]="['/']"
            fragment="console-core"
            (click)="closeMenu()"
          >
            Overview
          </a>
          <a
            class="mobile-nav-link"
            [class.mobile-nav-link--active]="isExperienceRoute()"
            [routerLink]="['/experience']"
            (click)="closeMenu()"
          >
            Experience
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
