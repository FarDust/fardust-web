<div class="ball-container">
  @if (renderError) {
    <div class="ball-fallback">
      <h1>{{ 'webgl_ball_demo' | translate }}</h1>
      <p>{{ 'webgl_ball_unavailable' | translate }}</p>
      <a routerLink="/">{{ 'back_home' | translate }}</a>
    </div>
  } @else {
    <canvas #canvas></canvas>
  }
</div>
