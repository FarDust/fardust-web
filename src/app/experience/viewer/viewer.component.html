<div class="mx-auto max-w-screen-xl px-4 py-8 sm:px-6 lg:px-8">
  <section
    class="rounded-[32px] border border-white/10 bg-[#0b1326]/90 p-6 text-white shadow-[0_30px_120px_rgba(2,6,23,0.55)]"
  >
    <div class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_auto] xl:items-end">
      <div>
        <p
          class="font-mono text-[10px] uppercase tracking-[0.32em] text-[#81ecff]/75"
        >
          Artifact Browser
        </p>
        <h1
          class="mt-3 font-display text-3xl font-bold tracking-tight text-white sm:text-4xl"
        >
          {{ 'cv_title' | translate }}
        </h1>
        <p class="mt-3 max-w-2xl text-sm leading-7 text-slate-300 sm:text-base">
          Mission-control view for the current curriculum artifact, with direct
          download, pagination, and zoom controls.
        </p>
      </div>
      <div class="flex flex-wrap gap-3">
        <a
          [href]="pdfSrc"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-[#81ecff] to-[#4b8eff] px-5 py-3 text-sm font-semibold text-[#001a41] shadow-lg shadow-cyan-500/20 transition hover:-translate-y-0.5 hover:shadow-cyan-400/30"
        >
          {{ 'open_pdf' | translate }}
        </a>
        <a
          [href]="pdfSrc"
          download
          class="inline-flex items-center justify-center rounded-full border border-white/10 bg-white/5 px-5 py-3 text-sm font-semibold text-white transition hover:border-[#81ecff]/40 hover:bg-white/10"
        >
          {{ 'download' | translate }}
        </a>
      </div>
    </div>
    <div
      class="mt-6 grid gap-4 xl:grid-cols-[minmax(0,1fr)_auto] xl:items-center"
    >
      <div class="rounded-[24px] border border-white/10 bg-[#131b2e]/90 p-4">
        <div class="flex flex-wrap items-center gap-3">
          <span
            class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-3 py-2 font-mono text-[10px] uppercase tracking-[0.28em] text-emerald-100"
          >
            Pdf Loaded
          </span>
          <span
            class="rounded-full border border-white/10 bg-[#060e20]/90 px-3 py-2 font-mono text-[10px] uppercase tracking-[0.28em] text-white/70"
          >
            Page {{ page }} / {{ totalPages || '?' }}
          </span>
          <span
            class="rounded-full border border-white/10 bg-[#060e20]/90 px-3 py-2 font-mono text-[10px] uppercase tracking-[0.28em] text-white/70"
          >
            Zoom {{ zoom.toFixed(1) }}x
          </span>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button
          (click)="prevPage()"
          [disabled]="page <= 1"
          class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-white transition hover:border-[#81ecff]/40 hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40"
        >
          {{ 'previous' | translate }}
        </button>
        <button
          (click)="nextPage()"
          [disabled]="totalPages && page >= totalPages"
          class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-white transition hover:border-[#81ecff]/40 hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40"
        >
          {{ 'next' | translate }}
        </button>
        <button
          (click)="zoomOut()"
          [disabled]="zoom <= 0.5"
          class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-white transition hover:border-[#81ecff]/40 hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40"
        >
          -
        </button>
        <button
          (click)="zoomIn()"
          class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-white transition hover:border-[#81ecff]/40 hover:bg-white/10"
        >
          +
        </button>
      </div>
    </div>
    <div class="mt-6">
      <div
        class="rounded-[28px] border border-white/10 bg-[#060e20]/90 p-3 shadow-[inset_0_1px_0_rgba(173,198,255,0.08)]"
      >
        <div class="rounded-[22px] border border-white/10 bg-white p-2 sm:p-4">
          <div class="flex justify-center box-border max-w-full w-full">
            <div
              class="flex h-[80vh] w-full max-w-[90vw] flex-col items-center overflow-hidden rounded-[18px] border border-slate-200 bg-white"
            >
              <pdf-viewer
                [src]="pdfSrc"
                [render-text]="true"
                [original-size]="false"
                [page]="page"
                [zoom]="zoom"
                (after-load-complete)="onPdfLoad($event)"
                style="width: 100%; height: 100%"
              ></pdf-viewer>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
