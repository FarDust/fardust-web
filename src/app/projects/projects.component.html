<div class="max-w-screen-lg mx-auto p-4">
  <h2 class="text-2xl mb-4">Projects</h2>
  <input
    [(ngModel)]="filter"
    placeholder="Filter projects..."
    class="mb-4 w-full rounded border px-2 py-1 md:w-1/2"
  />
  <div class="grid gap-4 md:grid-cols-2">
    @for (project of filteredProjects(); track project.url) {
      <div class="rounded bg-[#343a40] p-4 text-white">
        <h3 class="mb-2 text-xl font-bold">{{ project.name }}</h3>
        <p class="mb-2">{{ project.description }}</p>
        <a [href]="project.url" target="_blank" class="underline">
          Repository
        </a>
      </div>
    }
  </div>
</div>
