# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: node scripts/privacy-scan-staged.mjs --all
      - run: npm ci
      - run: npm test -- --browsers ChromeHeadlessNoSandbox --watch=false
      - run: npm run lint
      - run: npm run build
      - run: npm run lhci:collect
      - run: npm run lhci:assert
      - run: npm run lhci:upload
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_FARDUST }}'
          channelId: live
          projectId: landing-fardust
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
