name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: node scripts/privacy-scan-staged.mjs --all
      - run: npm ci
      - run: npm test -- --browsers ChromeHeadlessNoSandbox --watch=false
      - run: npm run lint
