name: Cleanup Firebase preview channels

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PREVIEW_CHANNEL_ID: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_FARDUST }}'
      - run: npm install -g firebase-tools
      - run: firebase hosting:channel:delete "$FIREBASE_PREVIEW_CHANNEL_ID" --project landing-fardust
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
